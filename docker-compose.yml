# voidboard — self-hosted deployment.
# Copy .env.example to .env and fill in the values before `docker compose up -d`.
services:
  voidboard:
    build: .
    image: ghcr.io/voidsuite/voidboard:latest
    container_name: voidboard
    restart: unless-stopped
    ports:
      - "${PORT:-3006}:3006"
    env_file:
      - .env
    volumes:
      # SQLite database + uploads persist across container recreates.
      - voidboard-data:/app/server/data

volumes:
  voidboard-data: